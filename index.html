<!DOCTYPE html>

<title>Demo · Media Player</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:#0b0b10;color:#fff;min-height:100vh;}
  header{padding:32px 40px 8px;}
  header h1{font-size:28px;margin-bottom:6px;}
  header p{opacity:.6;font-size:14px;}
  .row{padding:24px 40px;}
  .row h2{font-size:18px;margin-bottom:14px;font-weight:600;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;}
  .card{cursor:pointer;background:#15151c;border-radius:8px;overflow:hidden;
        transition:transform .2s,box-shadow .2s;border:1px solid rgba(255,255,255,.05);}
  .card:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(0,0,0,.5);}
  .card img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#222;display:block;}
  .card .body{padding:12px 14px 14px;}
  .card .t{font-weight:600;font-size:14px;margin-bottom:4px;
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card .d{font-size:12px;opacity:.65;
           display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .badge{display:inline-block;background:#e50914;color:#fff;font-size:10px;padding:2px 6px;
         border-radius:3px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
  @media (max-width:600px){header,.row{padding-left:18px;padding-right:18px;}}
</style>
</head>
<body>

</div>

<div class="row">

  <div class="grid" id="solo-grid"></div>
</div>

<script src="media-player.js"></script>
<script>
  // Inyectar catálogo en el reproductor
  MediaPlayer.setSeries(window.SERIES);
  MediaPlayer.setLibrary(window.EPISODES);

  // Render UI demo
  function card(ep) {
    const c = document.createElement('div');
    c.className = 'card';
    const series = ep.seriesid && window.SERIES.find(s => s.seriesid === ep.seriesid);
    c.innerHTML = `
      <img src="${ep.thumbnail || ''}" alt="" onerror="this.style.opacity=.2">
      <div class="body">
        ${series ? `<span class="badge">${series.titulo_serie}</span>` : ''}
        <div class="t">${ep.title}</div>
        <div class="d">${ep.description || ''}</div>
      </div>`;
    c.addEventListener('click', () => MediaPlayer.play(ep));
    return c;
  }
  const sg = document.getElementById('series-grid');
  const og = document.getElementById('solo-grid');
  window.EPISODES.forEach(ep => {
    (ep.seriesid ? sg : og).appendChild(card(ep));
  });
</script>
</body>
</html>
