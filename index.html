<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Demo — Reproductor estilo Netflix</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}
    body{background:#0b0b0f;color:#fff;min-height:100vh;padding:40px 24px}
    h1{font-size:28px;margin-bottom:6px}
    p.sub{opacity:.65;margin-bottom:28px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;max-width:1400px;margin:0 auto}
    .card{background:#16161d;border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .25s,box-shadow .25s}
    .card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(0,0,0,.5)}
    .thumb{aspect-ratio:16/9;background:#222 center/cover no-repeat;position:relative}
    .badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.7);padding:3px 8px;border-radius:4px;font-size:11px;font-weight:600}
    .body{padding:12px 14px}
    .body h3{font-size:15px;margin-bottom:4px}
    .body p{font-size:12px;opacity:.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .wrap{max-width:1400px;margin:0 auto}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🎬 Demo — Reproductor estilo Netflix / Prime Video</h1>
    <p class="sub">Haz clic en cualquier tarjeta para abrir el reproductor.</p>
    <div class="grid" id="grid"></div>
  </div>

  <!-- 1) Datos -->
  <script src="./episodios.js"></script>
  <!-- 2) Reproductor (autocontenido) -->
  <script src="./media-player.js"></script>
  <!-- 3) Demo: render de tarjetas + invocación -->
  <script>
    const grid = document.getElementById('grid');
    grid.innerHTML = window.EPISODIOS.map(ep => {
      const serie = window.SERIES.find(s => s.seriesid === ep.seriesid);
      return `
      <div class="card" data-id="${ep.id}">
        <div class="thumb" style="background-image:url('${ep.thumbnail || ep.thumbnail2 || (serie && serie.portada_serie) || ''}')">
          ${serie ? `<span class="badge">${serie.titulo_serie}</span>` : '<span class="badge">Episodio</span>'}
        </div>
        <div class="body">
          <h3>${ep.title}</h3>
          <p>${ep.description || 'No disponible'}</p>
        </div>
      </div>`;
    }).join('');
    grid.addEventListener('click', e => {
      const c = e.target.closest('.card'); if (!c) return;
      // Forma 1: por id (usa window.EPISODIOS / window.SERIES automáticamente)
      MediaPlayer.play(c.dataset.id);
      // Forma 2 explícita:
      // MediaPlayer.play(c.dataset.id, { episodes: window.EPISODIOS, series: window.SERIES });
    });
  </script>
</body>
</html>
